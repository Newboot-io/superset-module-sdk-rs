[package]
name = "superset-module-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Newboot <dev@newboot.io>"]
description = "Write a module for a Newboot Superset: module twin, secrets, telemetry and reload."
license = "Apache-2.0"
repository = "https://github.com/Newboot-io/superset-module-sdk-rs"
readme = "README.md"
keywords = ["newboot", "superset", "iot", "mqtt", "module"]
categories = ["network-programming"]

[lib]
name = "superset_module_sdk"

[workspace]
members = [".", "examples/minimal", "samples/alarm-monitor"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# rumqttc 0.25 still pulls rustls-webpki 0.102 and rustls-pemfile: see .cargo/audit.toml.
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
